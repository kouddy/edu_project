# Practice Sheets — local development only.
#
#   docker compose up --build
#
#   App        http://localhost:3000
#   Supabase   http://localhost:54321   Studio :54323   Mailpit :54324
#
# Supabase is a dependency here, not something this project hosts: the
# `supabase` service runs the Supabase CLI, which starts its standard
# local stack (the repo's supabase/config.toml drives it) as sibling
# containers through the host's Docker socket. The app container is the
# only image this project builds for itself.
#
# Teardown: `docker compose down` stops the app and the bootstrap, but
# the CLI's containers belong to the CLI — stop them with
# `supabase stop` (or from Docker Desktop). If the stack is already
# running because you started it yourself, the bootstrap just reports
# that and the app uses it as is.
#
# The two API keys inlined below are the CLI stack's standard local
# demo keys — public constants, valid only against a local stack.
# The app reaches the stack for server-side calls through the host's
# published 54321 port (extra_hosts), because http://localhost:54321
# is also what the browser uses and the app reads a single Supabase URL.

name: practice-sheets

services:

  supabase:
    build:
      context: .
      dockerfile: Dockerfile.cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./supabase:/project/supabase
    working_dir: /project
    # Services the app never calls are excluded to keep the stack
    # light. A name the CLI doesn't know shows up as an error in this
    # service's log; the stack then simply doesn't start.
    command:
      - sh
      - -c
      - supabase start -x realtime,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor; tail -f /dev/null

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
        NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE
      - SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q
      # Passed through from .env when set there; unset stays unset.
      - META_API_KEY
      - BASETEN_API_KEY
      - MODAL_API_KEY
      - GEMINI_API_KEY
      - ADMIN_API_KEY
      - GRADING_PROVIDER
      - GRADING_MODEL
      - GUIDANCE_PROVIDER
      - GUIDANCE_MODEL
      - IMAGE_MODEL
    extra_hosts:
      - "localhost:host-gateway"
    volumes:
      - guidance-cache:/app/.guidance-image-cache
    depends_on:
      - supabase
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/config').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  guidance-cache:
