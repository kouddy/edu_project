<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
<title>Practice Sheets Interactive Prototype</title>
<style>
  :root{
    --page:#e7d3b4;
    --phone:#fff9ef;
    --card:#fffdf7;
    --ink:#3d2b1f;
    --mid:#6f5138;
    --faint:#a3805f;
    --line:#cfa878;
    --line-soft:#ecd9ba;
    --fill:#fdf0da;
    --fill-dark:#f8d9a3;
    --btn:#e8710a;
    --btn-deep:#c75b00;
    --btn-ink:#fff8ec;
    --accent:#e8710a;
    --accent-pale:#fdebd0;
    --green:#3f7d3a;
    --red:#d2492b;
    --amber:#f0a30c;
    --shadow:0 18px 50px rgba(122,74,20,.35);
    --card-shadow:0 2px 7px rgba(146,90,32,.12),0 1px 2px rgba(146,90,32,.10);
    --grain:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.48 0 0 0 0 0.30 0 0 0 0 0.10 0 0 0 0.055 0"/></filter><rect width="140" height="140" filter="url(%23n)"/></svg>');
  }
  @media (prefers-color-scheme: dark){
    :root{
      --page:#20160d;
      --phone:#2c1f13;
      --card:#382a1b;
      --ink:#f7e9d2;
      --mid:#d9bd97;
      --faint:#b3946d;
      --line:#7d5c36;
      --line-soft:#54402a;
      --fill:#46331e;
      --fill-dark:#5d4426;
      --btn:#f59e0b;
      --btn-deep:#e8710a;
      --btn-ink:#2b1a08;
      --accent:#f59e0b;
      --accent-pale:#4d3517;
      --green:#7cc47f;
      --red:#ff8a70;
      --amber:#f5b73d;
      --shadow:0 18px 50px rgba(0,0,0,.6);
      --card-shadow:0 2px 7px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3);
      --grain:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.95 0 0 0 0 0.80 0 0 0 0 0.55 0 0 0 0.05 0"/></filter><rect width="140" height="140" filter="url(%23n)"/></svg>');
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--page);
    background-image:var(--grain);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:22px 12px 34px;
  }
  .hint{
    margin:0 0 16px;max-width:430px;text-align:center;
    font-size:14.5px;line-height:1.45;color:var(--mid);
  }
  .hint strong{color:var(--ink);font-weight:600}

  /* ---------- phone frame ---------- */
  .phone{
    position:relative;
    width:min(392px,100%);
    height:min(800px,calc(100vh - 110px));
    min-height:560px;
    background:var(--phone);
    background-image:var(--grain);
    border:2px solid var(--line);
    border-radius:38px;
    box-shadow:var(--shadow);
    overflow:hidden;
    display:flex;flex-direction:column;
  }
  .statusbar{
    flex:0 0 auto;
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 22px 4px;
    font-size:12px;color:var(--faint);letter-spacing:.02em;
  }
  .statusbar .dots{font-size:10px;letter-spacing:.25em}
  #screen{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:thin}
  .view{padding:14px 18px 26px;animation:fade .18s ease}
  @keyframes fade{from{opacity:.35}to{opacity:1}}
  @media (prefers-reduced-motion: reduce){.view{animation:none}}

  /* ---------- generic wireframe bits ---------- */
  .appname{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--btn-deep);margin:2px 0 6px;font-weight:700}
  h1.scr{font-size:23px;margin:0 0 6px;font-weight:800;line-height:1.15;font-family:"Nunito","Avenir Next","Trebuchet MS",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  h2.scr{font-size:19px;margin:0 0 6px;font-weight:800;font-family:"Nunito","Avenir Next","Trebuchet MS",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .sub{font-size:13.5px;color:var(--mid);line-height:1.45;margin:0 0 14px}
  .card{
    background:var(--card);border:1.5px solid var(--line-soft);border-radius:16px;
    padding:14px 15px;margin:0 0 12px;box-shadow:var(--card-shadow);
  }
  .card.flat{border-style:dashed;border-color:var(--line)}
  .card h3{margin:0 0 4px;font-size:15.5px;font-weight:800;font-family:"Nunito","Avenir Next","Trebuchet MS",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .card p{margin:0;font-size:13.5px;color:var(--mid);line-height:1.45}
  .rowline{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .btn{
    display:block;width:100%;border:1.5px solid var(--btn-deep);background:linear-gradient(165deg,#f07d12,var(--btn));color:var(--btn-ink);
    font:inherit;font-size:15.5px;font-weight:700;padding:13px 14px;border-radius:12px;cursor:pointer;text-align:center;
    box-shadow:0 3px 8px rgba(199,91,0,.28);
  }
  .btn:active{transform:scale(.99);background:var(--btn-deep)}
  .btn.secondary{background:var(--card);color:var(--btn-deep);border-color:var(--line);box-shadow:var(--card-shadow)}
  .btn.small{width:auto;display:inline-block;padding:8px 14px;font-size:13.5px;border-radius:10px}
  .btnrow{display:flex;gap:10px}
  .btnrow .btn{flex:1}
  .linkish{
    background:none;border:none;font:inherit;font-size:13px;color:var(--btn-deep);font-weight:600;
    text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 4px;
  }
  .remove-armed{
    display:inline-block;background:#d2492b;color:#fff8ec;border:1.5px solid #a8321f;
    font:inherit;font-size:14px;font-weight:800;padding:10px 18px;border-radius:999px;cursor:pointer;
    box-shadow:0 4px 12px rgba(210,73,43,.38);
  }
  .remove-armed:active{background:#a8321f;transform:scale(.98)}
  /* ---------- universal Back control ----------
     One shared control for every detail screen: same markup, same
     position (top-left of the screen header), same styling. */
  .backrow{margin:0 0 10px}
  .backbtn{
    background:none;border:none;font:inherit;font-size:14.5px;font-weight:700;color:var(--btn-deep);
    cursor:pointer;padding:6px 8px 6px 0;display:inline-flex;align-items:center;gap:3px;line-height:1;
  }
  .backbtn:active{opacity:.6}
  .center{text-align:center}
  label.f{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
  input[type=email],input[type=text],select{
    width:100%;font:inherit;font-size:15px;padding:12px 13px;border-radius:11px;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink);margin:0 0 14px;
  }
  input[type=email]:focus,input[type=text]:focus,select:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-pale);
  }
  input::placeholder{color:var(--faint)}
  .pill{
    display:inline-block;font-size:12px;font-weight:700;border:1.5px solid var(--line-soft);
    border-radius:999px;padding:3px 10px;color:var(--mid);background:var(--fill);
  }
  .pill.solid{background:var(--btn);color:var(--btn-ink);border-color:var(--btn-deep)}
  .pill.done{background:var(--green);color:#fff8ec;border-color:var(--green)}
  .pill.check{background:var(--amber);color:#402a12;border-color:#d98a06}
  .pill.todo{background:var(--fill);color:var(--mid);border-color:var(--line-soft)}
  .badges{display:flex;flex-direction:column;gap:6px;align-items:flex-end;justify-content:center;margin-left:auto;text-align:right;flex:0 0 auto}
  .badges .pill{white-space:nowrap}
  .feeditem>.badges{margin-left:auto;justify-content:flex-end}
  .feeditem>.pill{margin-left:auto;flex:0 0 auto}
  @media (prefers-color-scheme: dark){
    .pill.done{color:#122b10}
    .pill.check{color:#2b1a08}
  }
  .hwsub{font-size:12.5px;color:var(--mid);margin:1px 0 4px}
  .hwhint{font-size:12px;color:var(--faint);margin:2px 2px 0;line-height:1.4}
  .dashedbox{
    border:1.5px dashed var(--line);border-radius:12px;background:var(--fill);
    background-image:repeating-linear-gradient(transparent,transparent 23px,rgba(180,110,40,.10) 24px);
    display:flex;align-items:center;justify-content:center;text-align:center;
    color:var(--mid);font-size:13px;padding:14px;line-height:1.4;
  }
  .badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);
    font-size:14px;font-weight:800;background:var(--card);color:var(--ink);flex:0 0 auto;
  }
  .badge.ok{background:var(--green);color:#fff8ec;border-color:var(--green)}
  .badge.no{background:var(--red);color:#fff6ec;border-color:var(--red)}
  .badge.q{background:var(--amber);color:#402a12;border-color:#d98a06}
  @media (prefers-color-scheme: dark){
    .badge.ok{color:#122b10}
    .badge.no{color:#3d130a}
  }
  .divider{border:none;border-top:1px dashed var(--line-soft);margin:12px 0}

  /* ---------- kid switcher ---------- */
  .chips{display:flex;gap:8px;margin:4px 0 16px;flex-wrap:wrap}
  .chip{
    font:inherit;font-size:14px;font-weight:600;padding:8px 15px;border-radius:999px;
    border:1.5px solid var(--line);background:var(--card);color:var(--mid);cursor:pointer;
  }
  .chip.on{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
  .chip small{font-weight:500;opacity:.75}

  /* ---------- scan ---------- */
  .camera{
    position:relative;border:2px solid var(--line);border-radius:16px;background:var(--fill);
    background-image:linear-gradient(rgba(180,110,40,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(180,110,40,.07) 1px,transparent 1px);
    background-size:22px 22px;
    height:380px;overflow:hidden;
  }
  .camera .ph-label{
    position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;
    align-items:center;justify-content:center;color:var(--faint);font-size:13px;text-align:center;padding:20px;
  }
  .camera video,.camera canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .camera.live .ph-label{display:none}
  .camstart{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
    border:1.5px solid var(--btn-deep);background:linear-gradient(165deg,#f07d12,var(--btn));color:var(--btn-ink);
    font:inherit;font-size:14.5px;font-weight:700;padding:11px 18px;border-radius:999px;cursor:pointer;
    box-shadow:0 4px 14px rgba(122,74,20,.35);white-space:nowrap;
  }
  .camstart:active{background:var(--btn-deep)}
  .camnote{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;white-space:nowrap;
    font-size:11.5px;color:var(--mid);background:var(--card);border:1px solid var(--line-soft);
    padding:4px 10px;border-radius:999px;opacity:.92;
  }
  .corner{position:absolute;width:30px;height:30px;border:0 solid var(--btn-deep);opacity:.85}
  .corner.tl{top:14px;left:14px;border-top-width:3px;border-left-width:3px;border-top-left-radius:8px}
  .corner.tr{top:14px;right:14px;border-top-width:3px;border-right-width:3px;border-top-right-radius:8px}
  .corner.bl{bottom:14px;left:14px;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:8px}
  .corner.br{bottom:14px;right:14px;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:8px}
  .shutterwrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:16px}
  .scancontrols{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;width:100%;max-width:340px}
  .gallerybtn{justify-self:start;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;font:inherit;cursor:pointer;color:var(--mid);padding:2px 2px;max-width:76px}
  .gallerythumb{width:50px;height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--btn-deep);box-shadow:var(--card-shadow)}
  .gallerythumb svg{width:26px;height:26px;display:block}
  .gallerybtn .cap{font-size:11.5px;font-weight:700;line-height:1.15;text-align:center;color:var(--mid)}
  .gallerybtn:active .gallerythumb{background:var(--fill)}
  .scan-spacer{width:50px;justify-self:end}
  .shutter{
    width:66px;height:66px;border-radius:50%;border:2px solid var(--line);
    background:var(--card);cursor:pointer;position:relative;justify-self:center;
  }
  .shutter::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--btn);box-shadow:inset 0 0 0 3px rgba(255,248,236,.45)}
  .shutter:active::after{background:var(--btn-deep)}

  /* ---------- full-screen scan (immersive camera) ---------- */
  #screen.scan-screen{overflow:hidden}
  .scanfs{height:100%;display:flex;flex-direction:column;background:#1a120b;animation:fade .18s ease}
  @media (prefers-reduced-motion: reduce){.scanfs{animation:none}}
  .camera.fullscreen{flex:1 1 auto;height:auto;min-height:0;border:none;border-radius:0}
  .camera.fullscreen .corner.tl{top:64px;left:16px}
  .camera.fullscreen .corner.tr{top:64px;right:16px}
  .camera.fullscreen .corner.bl{bottom:178px;left:16px}
  .camera.fullscreen .corner.br{bottom:178px;right:16px}
  .camera.fullscreen .camnote{top:64px}
  .camclose{
    position:absolute;top:12px;left:12px;z-index:7;width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,255,255,.38);background:rgba(20,12,6,.58);color:#fff;
    font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-family:inherit;padding:0 0 2px;
  }
  .camclose:active{background:rgba(20,12,6,.84)}
  .cambad{
    position:absolute;top:16px;right:12px;z-index:7;background:rgba(20,12,6,.52);color:rgba(255,255,255,.94);
    border:1px solid rgba(255,255,255,.24);font:inherit;font-size:11px;font-weight:600;
    padding:7px 10px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .cambad:active{background:rgba(20,12,6,.78)}
  .scan-bottom{
    position:absolute;left:0;right:0;bottom:0;z-index:5;
    padding:10px 16px 16px;
    background:linear-gradient(to top,rgba(18,10,4,.72) 0%,rgba(18,10,4,.46) 62%,transparent 100%);
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .scan-bottom .thumbtray{width:100%;padding:10px 8px 2px 2px;justify-content:flex-start}
  .scan-bottom .scancontrols{max-width:360px}
  .scan-bottom .gallerybtn{color:#fff}
  .scan-bottom .gallerybtn .cap{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.65)}
  .scan-bottom .gallerythumb{background:rgba(255,249,239,.97)}
  .scan-bottom .shutter{border-color:rgba(255,255,255,.92);box-shadow:0 4px 14px rgba(0,0,0,.38);width:72px;height:72px;background:rgba(255,253,247,.96)}
  .tap-hint{font-size:12.5px;color:rgba(255,255,255,.94);text-shadow:0 1px 4px rgba(0,0,0,.65);font-weight:600}
  .phone.scan-active #toast{bottom:196px}
  /* Grade bar lives INSIDE .scan-bottom as its last (bottom-most) element,
     so tray / controls / grade form one bottom-anchored stack. Negative
     margins cancel .scan-bottom's side/bottom padding, making the bar
     stretch full-width and sit flush with the bottom edge of the app area. */
  .scan-grade{
    align-self:stretch;
    margin:6px -16px -16px;
    padding:12px 18px 14px;
    background:var(--phone);
    background-image:var(--grain);
    border-top:1.5px solid var(--line-soft);
    box-shadow:0 -6px 16px rgba(0,0,0,.22);
  }
  .scan-grade .btn{margin:0;width:100%}

  /* ---------- staged photo preview ---------- */
  .scanfs{position:relative}
  .thumbitem{cursor:pointer}
  .preview-overlay{
    position:absolute;inset:0;z-index:30;background:#0d0805;
    display:flex;flex-direction:column;animation:fade .16s ease;
  }
  @media (prefers-reduced-motion: reduce){.preview-overlay{animation:none}}
  .preview-stage{
    flex:1 1 auto;min-height:0;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    touch-action:none;
  }
  .preview-imgwrap{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    will-change:transform;transform-origin:center center;padding:18px 14px;
  }
  .preview-imgwrap img{
    max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;
    pointer-events:none;user-select:none;-webkit-user-select:none;border-radius:6px;
    box-shadow:0 10px 34px rgba(0,0,0,.5);background:#fff8ec;
  }
  .preview-ph{
    width:min(82%,320px);aspect-ratio:3/4;max-height:72vh;
    background:#fff8ec;border:1.5px solid var(--line);border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    color:var(--btn-deep);text-align:center;padding:22px;pointer-events:none;user-select:none;
  }
  .preview-ph .big{font-size:76px;line-height:1}
  .preview-ph .cap{font-size:13.5px;color:var(--mid);line-height:1.45;font-weight:600}
  .preview-ph.bad{opacity:.72;filter:blur(.4px)}
  .preview-close{z-index:32}
  .preview-arrow{
    position:absolute;top:50%;transform:translateY(-50%);z-index:32;
    width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.38);
    background:rgba(20,12,6,.62);color:#fff;font-size:26px;line-height:1;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;padding:0 0 3px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .preview-arrow:active{background:rgba(20,12,6,.88)}
  .preview-arrow.prev{left:12px}
  .preview-arrow.next{right:12px}
  .preview-arrow[disabled]{opacity:.35;pointer-events:none}
  .preview-count{
    position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:32;
    background:rgba(20,12,6,.58);color:#fff;border:1px solid rgba(255,255,255,.24);
    font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);letter-spacing:.04em;
  }
  .preview-bottom{
    flex:0 0 auto;padding:10px 16px 16px;background:rgba(13,8,5,.96);
    border-top:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;gap:9px;
  }
  .preview-hint{font-size:12px;color:rgba(255,255,255,.72);text-align:center;line-height:1.4;margin:0}
  .preview-remove{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    border:1.5px solid #ff8a70;background:rgba(210,73,43,.16);color:#ffb4a3;
    font:inherit;font-size:15.5px;font-weight:800;padding:13px 14px;border-radius:12px;cursor:pointer;
  }
  .preview-remove:active{background:rgba(210,73,43,.32)}
  .preview-remove svg{width:19px;height:19px;flex:0 0 auto}

  /* ---------- photo thumbnails ---------- */
  .thumbtray{
    display:flex;gap:12px;align-items:flex-start;
    padding:12px 8px 2px 4px;overflow-x:auto;overflow-y:visible;scrollbar-width:thin;
  }
  .thumbitem{position:relative;display:inline-block;width:56px;height:56px;flex:0 0 56px}
  .thumbitem img{
    width:56px;height:56px;display:block;object-fit:cover;
    border:1.5px solid var(--line);border-radius:12px;background:#fff8ec;box-shadow:var(--card-shadow);
  }
  .thumbitem .thumbph{
    width:56px;height:56px;display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--line);border-radius:12px;background:#fff8ec;color:var(--btn-deep);
    font-size:25px;box-shadow:var(--card-shadow);
  }
  .thumbitem.row{width:52px;height:52px;flex-basis:52px}
  .thumbitem.row img,.thumbitem.row .thumbph{width:52px;height:52px;border-radius:11px}
  .thumbx{
    position:absolute;top:-7px;right:-7px;width:22px;height:22px;padding:0;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--card);border-radius:50%;
    background:var(--ink);color:var(--phone);
    font:inherit;font-size:15px;font-weight:800;line-height:1;cursor:pointer;
    box-shadow:0 2px 6px rgba(61,43,31,.35);z-index:2;
  }
  .thumbx:active{background:var(--btn-deep)}

var timers = [];
function later(fn, ms){ var t=setTimeout(fn, ms); timers.push(t); return t; }
function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }

function kid(){ for (var i=0;i<state.kids.length;i++) if (state.kids[i].id===state.kidId) return state.kids[i]; return state.kids[0]; }
function isGina(){ return state.kidId==="gina"; }

function resolvedCount(){ var c=0; if(state.check["6"])c++; if(state.check["9"])c++; return c; }
function remainingUnsure(){ return 2 - resolvedCount(); }
function correctCount(){
  var c = 7;
  if (state.check["6"]==="correct") c++;
  if (state.check["9"]==="correct") c++;
  return c;
}
function scoreText(){
  var r = resolvedCount();
  if (r===2) return correctCount() + "/10 final";
  return correctCount() + "/" + (8 + r) + " graded · " + (2 - r) + " need" + ((2-r)===1?"s":"") + " your check";
}
function gradedText(){ return correctCount() + "/" + (8 + resolvedCount()) + " graded"; }
function checkText(){ return remainingUnsure() + " need your check"; }
function statusBadges(){
  if (remainingUnsure()===0) return '<span class="pill solid">'+scoreText()+'</span>';
  return '<span class="pill done">'+gradedText()+'</span><span class="pill check">'+checkText()+'</span>';
}
function verdictOf(q){
  if (q.verdict==="unsure"){
    var r = state.check[String(q.n)];
    if (r) return r;
    return "unsure";
  }
  return q.verdict;
}
function mark(v){ return v==="correct" ? "✓" : (v==="wrong" ? "✗" : "?"); }
function badgeCls(v){ return v==="correct" ? "ok" : (v==="wrong" ? "no" : "q"); }

function photoLabel(key){ return key === "demo" ? "Math Week 12" : "Math · Set C"; }

  for (var i=0;i<state.photos.length;i++) if (state.photos[i].key===key) return state.photos[i];
  return null;
}
function nextPhotoKey(){
  if (state.batch.indexOf("demo") < 0) return "demo";
  if (state.batch.indexOf("sheetC") < 0) return "sheetC";
  return null;
}
function addPhoto(key, thumb){
  if (state.batch.indexOf(key) < 0) state.batch.push(key);
  var p = photoFor(key);
  if (p) p.thumb = thumb || null;
  else state.photos.push({key:key, thumb:thumb || null});
}
function thumbFromDrawable(drawable, w, h){
  if (!drawable || !w || !h) return null;
  try {
    var max = 320;
    var scale = Math.min(1, max / Math.max(w, h));
    var cw = Math.max(1, Math.round(w * scale));
    var ch = Math.max(1, Math.round(h * scale));
    var cv = document.createElement("canvas");
    cv.width = cw; cv.height = ch;
    var ctx = cv.getContext("2d");
    if (!ctx) return null;
    ctx.fillStyle = "#fff8ec";
    ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(drawable, 0, 0, cw, ch);
    return cv.toDataURL("image/jpeg", 0.82);
  } catch(e){ return null; }
}
/* ================= staged photos (pre-grading) =================

function slotsLeft(){
  return 2 - state.batch.length - state.staged.length;

function pushStaged(thumb, bad){
  state.stagedSeq++;

function stageBadPhoto(){

function stagedThumbHtml(it){

function setupPreviewGestures(){
  var stage=document.getElementById('previewStage');
  if(!stage) return;
  pvApply();
  stage.addEventListener('pointerdown', function(e){
    if(e.target && e.target.closest && e.target.closest('button')) return;
    try{ stage.setPointerCapture(e.pointerId); }catch(err){}
    if(Object.keys(pvPointers).length===0){ pvStartX=e.clientX; pvStartY=e.clientY; pvMoved=false; }
    pvPointers[e.pointerId]={x:e.clientX,y:e.clientY};
    if(Object.keys(pvPointers).length===2){
      var pts=Object.keys(pvPointers).map(function(k){return pvPointers[k];});
      pvStartDist=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      pvStartScale=pvScale;
    }
  });
  stage.addEventListener('pointermove', function(e){
    if(!pvPointers[e.pointerId]) return;
    var prev=pvPointers[e.pointerId];
    var dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    if(Math.abs(e.clientX-pvStartX)+Math.abs(e.clientY-pvStartY)>8) pvMoved=true;
    pvPointers[e.pointerId]={x:e.clientX,y:e.clientY};
    if(Object.keys(pvPointers).length===2){
      var pts=Object.keys(pvPointers).map(function(k){return pvPointers[k];});
      var dist=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      if(pvStartDist>0){
        pvScale=Math.min(4, Math.max(1, pvStartScale*dist/pvStartDist));
        if(pvScale===1){ pvTx=0; pvTy=0; }
        pvApply();
      }
    } else if(Object.keys(pvPointers).length===1 && pvScale>1){
      pvTx+=dx; pvTy+=dy; pvApply();
    }
  });
  function endPointer(e){
    var wasSingle=Object.keys(pvPointers).length===1;
    var dx=e.clientX-pvStartX, dy=e.clientY-pvStartY;
    delete pvPointers[e.pointerId];
    if(Object.keys(pvPointers).length<2) pvStartDist=0;
    if(!wasSingle) return;
    /* Swipe to switch photos (only when not zoomed) */
    if(pvScale===1 && Math.abs(dx)>60 && Math.abs(dy)<80){
      if(dx<0) previewGo(1); else previewGo(-1);
      pvLastTap=0;
      return;
    }
    /* Double-tap detection */
    if(!pvMoved && pvScale===1 || !pvMoved && pvScale>1){
      var now=Date.now();
      if(now-pvLastTap<320){ togglePreviewZoom(); pvLastTap=0; return; }
      pvLastTap=now;
    }
  }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', function(e){ delete pvPointers[e.pointerId]; });
  /* Double-tap is handled in endPointer via pvLastTap (covers touch + mouse);
     no separate dblclick listener, which would toggle a second time. */
  stage.addEventListener('click', function(e){
    if(e.target===stage){ closeStagedPreview(); }
  });
  stage.addEventListener('wheel', function(e){
    e.preventDefault();
    pvScale=Math.min(4, Math.max(1, pvScale+(e.deltaY<0?0.25:-0.25)));
    if(pvScale===1){ pvTx=0; pvTy=0; }
    pvApply();
  }, {passive:false});
}

/* ---------- Remove guard: tap-again-to-confirm ----------
   First tap arms the control in place ("Tap again to remove",
   solid red) and removes NOTHING. A second tap on the same sheet
   while armed performs the removal via removeGradedSheet().
   The armed state lasts ~4 seconds; expiry or leaving the screen
   quietly disarms it. Only one sheet can be armed at a time. */
var armedRemoveKey = null;
var armedRemoveTimer = null;
function disarmRemove(){
  armedRemoveKey = null;
  if (armedRemoveTimer){ clearTimeout(armedRemoveTimer); armedRemoveTimer = null; }
}
function armRemove(key){
  disarmRemove();
  armedRemoveKey = key;
  armedRemoveTimer = setTimeout(function(){
    armedRemoveTimer = null;
    armedRemoveKey = null;
    render();
  }, 4000);
  render();
}
function tapRemoveSheet(key){
  if (armedRemoveKey === key){
    disarmRemove();

function removeControlHtml(key){

    return '<p class="center" style="margin-top:12px"><button type="button" class="remove-armed" onclick="tapRemoveSheet(\''+key+'\')">Tap again to remove</button></p>';
  }

function render(){
  var inApp = ["home","scan","grading","results","mockresults","check","rejected","profile","sheetstate"].indexOf(state.screen) >= 0;
  var isScan = state.screen === "scan";
  /* Scan is a full-screen camera: the tab bar is hidden while in it —
     its job is only to get you to the camera. Every other in-app
     screen keeps the tab bar exactly as before. */
  tabbar.classList.toggle("show", inApp && !isScan);
  screenEl.classList.toggle("scan-screen", isScan);
  var phoneEl = document.querySelector(".phone");
  if (phoneEl) phoneEl.classList.toggle("scan-active", isScan);
  var tabs = tabbar.querySelectorAll(".tab");
  tabs.forEach(function(t){

      (key==="home" && ["results","mockresults","check","grading","rejected","sheetstate"].indexOf(state.screen)>=0);
    t.classList.toggle("on", !!active);
  });
  var html = "";
  switch(state.screen){
    case "signin":    html = vSignin(); break;
    case "checkmail": html = vCheckmail(); break;
    case "home":      html = vHome(); break;
    case "profile":   html = vProfile(); break;
    case "scan":      html = vScan(); break;
    case "grading":   html = vGrading(); break;
    case "results":   html = vResults(); break;
    case "mockresults": html = vMockResults(); break;
    case "sheetstate": html = vSheetState(); break;
    case "check":     html = vCheck(); break;
    case "rejected":  html = vRejected(); break;

  screenEl.innerHTML = html;
  if (state.screen==="home" && state.pendingHomeScroll){
    var targetId = state.pendingHomeScroll==="homework" ? "homework-section" : "history-section";
    state.pendingHomeScroll = null;
    var targetEl = document.getElementById(targetId);
    if (targetEl && targetEl.scrollIntoView) { try{ targetEl.scrollIntoView({block:"start"}); }catch(e){} if(screenEl) screenEl.scrollTop = Math.max(0, targetEl.offsetTop - 12); }

     its last element — there is no separate phone-level grade row to toggle. */
  if (state.screen==="scan"){ startCamera(); if (state.previewStagedId!=null) setupPreviewGestures(); }

/* ================= profile / parent card ================= */
function qrSvg(){
  var n = 25, cell = 10;
  var seed = 987654321;
  function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  function inFinder(x,y){
    return (x < 8 && y < 8) || (x >= n-8 && y < 8) || (x < 8 && y >= n-8);
  }
  var s = '<svg viewBox="0 0 250 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Your member QR code">';
  s += '<rect width="250" height="250" fill="#ffffff"/>';
  for (var y=0; y<n; y++){
    for (var x=0; x<n; x++){
      if (inFinder(x,y)) continue;
      if (rnd() > 0.52) s += '<rect x="'+(x*cell)+'" y="'+(y*cell)+'" width="'+cell+'" height="'+cell+'" fill="#2b1a08"/>';
    }
  }
  function finder(fx,fy){
    var r = '';
    r += '<rect x="'+(fx*cell)+'" y="'+(fy*cell)+'" width="'+(7*cell)+'" height="'+(7*cell)+'" fill="#2b1a08"/>';
    r += '<rect x="'+((fx+1)*cell)+'" y="'+((fy+1)*cell)+'" width="'+(5*cell)+'" height="'+(5*cell)+'" fill="#ffffff"/>';
    r += '<rect x="'+((fx+2)*cell)+'" y="'+((fy+2)*cell)+'" width="'+(3*cell)+'" height="'+(3*cell)+'" fill="#2b1a08"/>';
    return r;
  }
  s += finder(0,0) + finder(n-7,0) + finder(0,n-7);
  s += '</svg>';
  return s;
}

function vScan(){

/* ================= real camera =================
   One stream, owned here: started when the Scan screen opens, every track
   stopped when leaving it. Any failure (no API, denied, blocked in an
   embed) falls back to the simulated viewfinder so scanning never dead-ends. */
var camStream = null;
var camLive = false;
var camStarting = false;
function markCamLive(){
  camLive = true;
  var box = document.getElementById("cambox");
  if (box) box.classList.add("live");
  var b = document.getElementById("camstart");
  if (b) b.style.display = "none";
  var note = document.getElementById("camnote");
  if (note) note.style.display = "none";
}
function attachCamStream(){
  var v = document.getElementById("camvideo");
  if (!v || !camStream) return;
  v.srcObject = camStream;
  var p = v.play();
  if (p && p.catch) p.catch(function(){});
  markCamLive();
}
function camUnavailable(){
  camLive = false;
  camStarting = false;
  var note = document.getElementById("camnote");
  if (note) note.style.display = "block";
  var b = document.getElementById("camstart");
  if (b) b.style.display = "none";
}
function startCamera(){
  if (camStream){ attachCamStream(); return; }
  if (camStarting) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ camUnavailable(); return; }
  camStarting = true;
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false })
    .then(function(stream){
      camStarting = false;
      if (state.screen !== "scan"){
        stream.getTracks().forEach(function(t){ t.stop(); });
        return;
      }
      camStream = stream;
      attachCamStream();
    })
    .catch(function(){ camUnavailable(); });
}
function stopCamera(){
  if (camStream){
    camStream.getTracks().forEach(function(t){ t.stop(); });
    camStream = null;
  }
  camLive = false;
  camStarting = false;
  var v = document.getElementById("camvideo");
  if (v) v.srcObject = null;
}
function shutterTap(){
  if (slotsLeft() <= 0){ toast("Demo has two sample sheets"); return; }
  var v = document.getElementById("camvideo");
  var c = document.getElementById("camfreeze");
  if (camLive && v && c && v.videoWidth){
    /* Stage the real captured frame as this photo's thumbnail.
       Grading waits for the Grade button. */
    var thumb = thumbFromDrawable(v, v.videoWidth, v.videoHeight);
    pushStaged(thumb, false);
    c.width = v.videoWidth;
    c.height = v.videoHeight;
    var ctx = c.getContext("2d");
    if (ctx){
      ctx.drawImage(v, 0, 0, c.width, c.height);
      c.style.display = "block";
      /* Brief freeze as capture feedback, then back to the live
         viewfinder with the new thumbnail in the tray. */
      later(function(){ if (state.screen === "scan") render(); }, 750);
      return;
    }
    render();
    return;
  }
  /* Fallback demo view: no real frame, so the thumbnail is a placeholder. */
  pushStaged(null, false);
  render();
}

/* ================= grading ================= */
function startGradingStaged(){
  if (!state.staged.length) return;
  state.previewStagedId=null; pvResetZoom();
  /* Assign demo keys to the good photos in staged order; a bad photo
     gets no key — it is rejected when the set is graded. */
  var goods = [];
  var hasBad = false;
  var used = state.batch.slice();
  state.staged.forEach(function(it){
    if (it.bad){ hasBad = true; return; }
    var key = null;
    if (used.indexOf("demo") < 0) key = "demo";
    else if (used.indexOf("sheetC") < 0) key = "sheetC";
    if (key){ used.push(key); goods.push({key:key, thumb:it.thumb || null}); }
  });
  state.gradingSet = {goods:goods, hasBad:hasBad};
  state.gradingFor = goods.length ? goods[0].key : "bad";
  go("grading");
}
/* ================= upload photo (real file picker) =================
   Tapping Upload Photo clicks the hidden file input inside the tap
   gesture, so the phone opens its photo library / files picker. The
   picker allows multiple photos: each picked photo is only STAGED
   into the Scan tray, in the order picked — grading waits for the
   Grade button. The two-sheet demo cap counts graded, staged,
   camera and uploaded photos together; extras are not staged and
   get one toast. Cancelling the picker fires no change event, so
   nothing changes. */
function pickExistingPhoto(){
  var inp = document.getElementById("photopicker");
  if (!inp || typeof inp.click !== "function" || !window.URL || !window.FileReader){
    toast("Photo picker isn't available here");
    return;
  }
  try { inp.click(); }
  catch(e){ toast("Photo picker isn't available here"); }
}
function stageUploadedFiles(files, idx){
  if (idx >= files.length){ render(); return; }
  if (state.screen !== "scan") return;
  var url = URL.createObjectURL(files[idx]);
  var img = new Image();
  img.onload = function(){
    URL.revokeObjectURL(url);
    if (state.screen !== "scan") return;
    /* The actual picked image becomes this staged photo's thumbnail. */
    pushStaged(thumbFromDrawable(img, img.naturalWidth, img.naturalHeight), false);
    stageUploadedFiles(files, idx + 1);
  };
  img.onerror = function(){
    URL.revokeObjectURL(url);
    if (state.screen !== "scan") return;
    pushStaged(null, false);
    stageUploadedFiles(files, idx + 1);
  };
  img.src = url;
}
(function(){
  var inp = document.getElementById("photopicker");
  if (!inp) return;
  inp.addEventListener("change", function(){
    var files = inp.files ? Array.prototype.slice.call(inp.files) : [];
    inp.value = ""; /* reset so the same photos can be picked again */
    if (!files.length) return; /* picker cancelled — nothing happened */
    if (state.screen !== "scan") return;
    var slots = slotsLeft();
    if (slots <= 0){ toast("Demo has two sample sheets"); return; }
    var accepted = files.slice(0, slots);
    if (accepted.length < files.length) toast("Demo has two sample sheets");
    stageUploadedFiles(accepted, 0);
  });
})();
function vGrading(){
  var set = state.gradingSet;
  var total = set ? set.goods.length + (set.hasBad ? 1 : 0) : 1;
  var label = total === 1 ? "Gina's answers for Math Week 12" : "Gina's answers for Math Week 12 — " + total + " sheets";
  return '<div class="view"><div style="padding-top:44px" class="center">' +
    '<div class="emptyart">◌</div><h2 class="scr">Grading…</h2>' +
    '<p class="sub">Reading '+label+'<br>and checking them against the answer key.</p></div>' +
    '<div class="track"><div class="bar" id="gradebar"></div></div>' +
    '<div class="steps" id="gradesteps"><div id="gs1">· Reading the photo…</div><div id="gs2">· Matching answers to the key…</div><div id="gs3">· Writing feedback…</div></div>' +
    '<p class="center" style="margin-top:18px"><button class="linkish" onclick="go(\'home\')">Cancel</button></p></div>';
}
function startGrading(){
  var bar = document.getElementById("gradebar");
  var pct = 0;
  var iv = setInterval(function(){
    pct += 8 + Math.random()*10;
    if (pct >= 100){ pct = 100; clearInterval(iv); }
    if (bar) bar.style.width = pct + "%";
    var s1=document.getElementById("gs1"), s2=document.getElementById("gs2"), s3=document.getElementById("gs3");
    if (s1 && pct>20){ s1.className="done"; s1.textContent="✓ Photo read"; }
    if (s2 && pct>55){ s2.className="done"; s2.textContent="✓ Answers matched"; }
    if (s3 && pct>85){ s3.className="done"; s3.textContent="✓ Feedback written"; }
  }, 220);
  timers.push(iv);
  later(function(){
    clearInterval(iv);
    var set = state.gradingSet;
    state.gradingSet = null;
    state.gradingFor = null;
    state.pendingThumb = null;
    if (!set) return;
    /* The whole staged set grades at once: good photos become graded
       sheets and the staged tray clears; a bad photo in the set is
       rejected instead (it is discarded with the tray, the good ones
       are already marked). Downstream state (scanDone, Week 12,
       streak, badges) only ever changes here — at grading time.
       There is no post-grading receipt screen: marking lands on
       Home — the demo sheet updates its Homework row, and a second
       sheet (Set C) joins History as a finished record. */
    set.goods.forEach(function(g){
      if (g.key === "demo") state.scanDone = true;
      addPhoto(g.key, g.thumb);
    });
    state.staged = [];
    var marked = set.goods.length;
    state.lastMarked = set.hasBad ? marked : 0;
    if (state.screen==="grading"){
      if (set.hasBad){ go("rejected"); }
      else {
        go("home");
        if (marked) toast(marked === 1 ? "1 sheet marked" : marked + " sheets marked");
      }
    }
  }, 2600);
}

/* ================= parent check ================= */
function currentCheckQ(){
  var order = [6,9];
  for (var i=0;i<order.length;i++) if (!state.check[String(order[i])]) return order[i];
  return null;
}
function vCheck(){
  var qn = currentCheckQ();

      '<div style="margin-top:13px"><button class="btn" onclick="go(\'home\')">Back to Home</button></div></div>';
  } else {

    h += '<p class="progressdots center" style="margin-bottom:12px">'+pos+' of 2</p>';
    h += '<div class="card"><h3>Gina · Math Week 12 · Q'+q.n+'</h3>' +

      '<p style="margin-top:10px">'+q.aiSays+'. Was Gina\'s final answer <strong style="color:var(--ink)">'+q.correct+'</strong>?</p>' +
      '<div class="btnrow" style="margin-top:13px">' +
      '<button class="btn" onclick="resolveCheck('+q.n+',\'correct\')">It was correct</button>' +
      '<button class="btn secondary" onclick="resolveCheck('+q.n+',\'wrong\')">It was wrong</button></div></div>';
    h += '<p class="center"><button class="linkish" onclick="backFromCheck()">Finish later'+(state.checkOrigin==='results' ? ' — back to results' : ' — back to Home')+'</button></p>';
  }
  h += '</div>';
  return h;

function resolveCheck(n, verdict){
  state.check[String(n)] = verdict;
  if (n===9 && verdict==="wrong") toast("Q9 marked wrong — recorded in Gina's progress");
  else if (verdict==="correct") toast("Marked correct");
  else toast("Marked wrong");
  render();
}
